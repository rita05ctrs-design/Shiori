name: Shiori CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: shiori-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Typecheck, Lint, Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Unit & stress tests
        run: npm test

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
