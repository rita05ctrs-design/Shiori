<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" fill="none" role="img" aria-label="Shiori — Suivi Anime et Manga">
  <defs>
    <!-- Base Obsidian Backdrop -->
    <linearGradient id="bgBase" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07080C" />
      <stop offset="52%" stop-color="#0B0C13" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>

    <!-- Atmospheric Radial Glows -->
    <radialGradient id="crimsonAura" cx="20%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#E5484D" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07080C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldAura" cx="84%" cy="26%" r="42%">
      <stop offset="0%" stop-color="#F0B95B" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#E5484D" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#07080C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emblemGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.34" />
      <stop offset="70%" stop-color="#F0B95B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0E1017" stop-opacity="0" />
    </radialGradient>

    <!-- Top & Bottom Accent Shimmer Hairlines -->
    <linearGradient id="topShimmer" x1="120" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0" />
      <stop offset="28%" stop-color="#E5484D" stop-opacity="0.95" />
      <stop offset="68%" stop-color="#F0B95B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F0B95B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveStroke1" x1="540" y1="290" x2="1280" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0" />
      <stop offset="45%" stop-color="#E5484D" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#F0B95B" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="waveStroke2" x1="660" y1="320" x2="1280" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0B95B" stop-opacity="0" />
      <stop offset="55%" stop-color="#F0B95B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#E5484D" stop-opacity="0.55" />
    </linearGradient>

    <!-- Shiori Bookmark Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="128" y1="100" x2="208" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F45B62" />
      <stop offset="52%" stop-color="#E5484D" />
      <stop offset="100%" stop-color="#A81F2A" />
    </linearGradient>

    <!-- Emblem Frame Stroke -->
    <linearGradient id="frameStroke" x1="88" y1="80" x2="248" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#E5484D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F0B95B" stop-opacity="0.28" />
    </linearGradient>

    <!-- Title Off-White Editorial Gradient -->
    <linearGradient id="titleGrad" x1="0" y1="115" x2="0" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F4F3EE" />
      <stop offset="100%" stop-color="#D8D4C8" />
    </linearGradient>

    <!-- Vertical Gold Divider -->
    <linearGradient id="goldDivider" x1="0" y1="122" x2="0" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0B95B" stop-opacity="0" />
      <stop offset="50%" stop-color="#F0B95B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E5484D" stop-opacity="0" />
    </linearGradient>

    <!-- Fine Dot Pattern -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4F3EE" fill-opacity="0.065" />
    </pattern>

    <!-- Soft Fade Mask for Right Dot Grid -->
    <linearGradient id="gridMaskGrad" x1="400" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <mask id="gridMask">
      <rect width="1280" height="320" fill="url(#gridMaskGrad)" />
    </mask>

    <!-- Clip Path for Rounded Banner -->
    <clipPath id="bannerClip">
      <rect width="1280" height="320" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Background Layers -->
    <rect width="1280" height="320" fill="url(#bgBase)" />
    <rect width="1280" height="320" fill="url(#crimsonAura)" />
    <rect width="1280" height="320" fill="url(#goldAura)" />
    <rect width="1280" height="320" fill="url(#dotGrid)" mask="url(#gridMask)" />

    <!-- Subtle Decorative Silk Waves (Mizuhiki) -->
    <path d="M520 326 C720 278, 920 296, 1295 162" stroke="url(#waveStroke1)" stroke-width="2" fill="none" />
    <path d="M620 330 C835 288, 1020 298, 1295 206" stroke="url(#waveStroke2)" stroke-width="1.35" fill="none" />
    <path d="M740 332 C950 302, 1105 304, 1295 244" stroke="#E5484D" stroke-opacity="0.22" stroke-width="1" fill="none" />

    <!-- Giant Editorial Kanji Watermark (Right) -->
    <text x="1125" y="222" text-anchor="middle" fill="#F0B95B" fill-opacity="0.06" font-size="250" font-weight="700" font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', Georgia, serif">栞</text>

    <!-- Delicate Floating Ember & Gold Particles -->
    <circle cx="965" cy="74" r="3" fill="#F0B95B" fill-opacity="0.55" />
    <circle cx="1042" cy="112" r="2" fill="#E5484D" fill-opacity="0.65" />
    <circle cx="912" cy="148" r="1.8" fill="#F4F3EE" fill-opacity="0.35" />
    <circle cx="1188" cy="84" r="2.5" fill="#F0B95B" fill-opacity="0.4" />
    <circle cx="1095" cy="242" r="2.2" fill="#E5484D" fill-opacity="0.5" />
    <circle cx="72" cy="72" r="2" fill="#E5484D" fill-opacity="0.45" />
    <circle cx="268" cy="64" r="1.8" fill="#F0B95B" fill-opacity="0.45" />

    <!-- Left Frosted Emblem Card -->
    <rect x="88" y="80" width="160" height="160" rx="36" fill="#0E1017" fill-opacity="0.92" stroke="url(#frameStroke)" stroke-width="1.5" />
    <rect x="88" y="80" width="160" height="160" rx="36" fill="url(#emblemGlow)" />

    <!-- Shiori Bookmark Ribbon Icon -->
    <path d="M130 112 C130 105.4 135.4 100 142 100 H194 C200.6 100 206 105.4 206 112 V217 L168 192 L130 217 V112 Z" fill="url(#ribbonGrad)" />
    <path d="M134 112 C134 107.6 137.6 104 142 104 H194 C198.4 104 202 107.6 202 112 V209.6 L169.8 188.5 L168 187.3 L166.2 188.5 L134 209.6 V112 Z" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" />
    <text x="168" y="154" text-anchor="middle" dominant-baseline="central" fill="#FFF9F7" font-size="44" font-weight="700" font-family="'Noto Sans JP', 'Yu Mincho', 'Hiragino Sans', Georgia, serif">栞</text>

    <!-- Editorial Eyebrow Label -->
    <circle cx="293" cy="101" r="3.5" fill="#F0B95B" />
    <text x="307" y="106" fill="#F0B95B" font-size="12.5" font-weight="700" letter-spacing="3.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">ANIME &amp; MANGA TRACKER</text>

    <!-- Hero Title + Kanji Signature -->
    <text x="286" y="178" fill="url(#titleGrad)" font-size="76" font-weight="800" letter-spacing="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">SHIORI</text>
    <line x1="630" y1="122" x2="630" y2="182" stroke="url(#goldDivider)" stroke-width="1.5" />
    <text x="652" y="174" fill="#F0B95B" fill-opacity="0.92" font-size="48" font-weight="600" font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', Georgia, serif">栞</text>

    <!-- Subtitle -->
    <text x="288" y="216" fill="#B8BCCB" font-size="18" font-weight="400" letter-spacing="0.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">Bibliothèque personnelle · Calendrier Simulcast · Communauté &amp; Sync AniList</text>

    <!-- Feature Pills Row -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E6E8F0">
      <!-- Pill 1 -->
      <rect x="288" y="238" width="124" height="30" rx="15" fill="#151822" fill-opacity="0.88" stroke="#E5484D" stroke-opacity="0.38" stroke-width="1" />
      <circle cx="306" cy="253" r="3.5" fill="#E5484D" />
      <text x="318" y="257.5">Next.js 15</text>

      <!-- Pill 2 -->
      <rect x="424" y="238" width="146" height="30" rx="15" fill="#151822" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
      <circle cx="442" cy="253" r="3.5" fill="#3ECF8E" />
      <text x="454" y="257.5">Supabase RLS</text>

      <!-- Pill 3 -->
      <rect x="582" y="238" width="142" height="30" rx="15" fill="#151822" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
      <circle cx="600" cy="253" r="3.5" fill="#02A9FF" />
      <text x="612" y="257.5">AniList OAuth</text>

      <!-- Pill 4 -->
      <rect x="736" y="238" width="124" height="30" rx="15" fill="#151822" fill-opacity="0.88" stroke="#F0B95B" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="754" cy="253" r="3.5" fill="#F0B95B" />
      <text x="766" y="257.5">PWA Ready</text>
    </g>

    <!-- Top & Outer Specular Frame -->
    <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="23.25" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5" fill="none" />
    <line x1="120" y1="1.5" x2="1160" y2="1.5" stroke="url(#topShimmer)" stroke-width="2" />
  </g>
</svg>
