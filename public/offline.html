<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07080C" />
    <title>Shiori — Hors-ligne</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 0%, rgba(229, 72, 77, 0.16), #07080c 58%);
        color: #f4f3ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 400px;
        width: 100%;
        padding: 32px 24px;
        border-radius: 24px;
        background: rgba(14, 16, 23, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        display: block;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13.5px;
        color: #9a9eae;
        line-height: 1.6;
        margin: 0 0 22px;
      }
      button {
        background: #e5484d;
        color: #fff;
        border: none;
        padding: 11px 22px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon.svg" alt="Shiori" class="logo" />
      <h1>Connexion interrompue</h1>
      <p>
        Shiori a besoin d'une connexion internet pour actualiser vos animés, mangas et messages en temps réel.
      </p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </div>
  </body>
</html>
